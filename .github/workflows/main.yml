
name: RayBan - Compilar CameraAccess

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-26

    steps:
      - name: Descargar SDK de Meta
        run: |
          git clone --depth 1 https://github.com/facebook/meta-wearables-dat-ios.git meta-sdk

      - name: Mostrar proyectos disponibles
        run: |
          xcodebuild -list \
            -project meta-sdk/samples/CameraAccess/CameraAccess.xcodeproj

      - name: Compilar para simulador iOS
        run: |
          xcodebuild build \
            -project meta-sdk/samples/CameraAccess/CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
