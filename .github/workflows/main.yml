
name: RayBan - Comprobar desarrollo iOS

on:
  workflow_dispatch:

jobs:
  comprobar-ios:
    runs-on: macos-15

    steps:
      - name: Comprobar macOS
        run: sw_vers

      - name: Comprobar Xcode
        run: xcodebuild -version

      - name: Comprobar Swift
        run: swift --version

      - name: Comprobar SDK de iOS
        run: xcodebuild -showsdks

      - name: Finalizar
        run: echo "Entorno de desarrollo iOS disponible"
