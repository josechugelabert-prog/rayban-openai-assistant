
name: RayBan - Comprobar GitHub Actions

on:
  workflow_dispatch:

jobs:
  comprobar-entorno:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar sistema operativo
        run: uname -a

      - name: Comprobar Python
        run: python3 --version

      - name: Comprobar Git
        run: git --version

      - name: Confirmar funcionamiento
        run: |
          echo "GitHub Actions funciona correctamente"
          echo "Prueba de entorno completada"
