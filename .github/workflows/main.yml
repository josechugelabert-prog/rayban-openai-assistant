name: OpenVision | iPhone build

on:
  push:
    branches: [test/openvision-ios]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openvision-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

defaults:
  run:
    working-directory: openvision

jobs:
  ios:
    name: OpenVision (device)
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Xcode and configuration
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          cp Config.xcconfig.example Config.xcconfig
          cp OpenVision/Config/Config.swift.example OpenVision/Config/Config.swift
      - name: Build app and tests for device
        run: |
          xcodebuild build-for-testing -project OpenVision.xcodeproj -scheme OpenVision \
            -configuration Debug -destination 'generic/platform=iOS' -derivedDataPath "$PWD/.build" \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=
      - name: Package the unsigned device IPA
        run: |
          trap 'echo "::error::IPA packaging failed at line $LINENO while running: $BASH_COMMAND"' ERR
          products="$PWD/.build/Build/Products"
          app="$(find "$products" -type d -name OpenVision.app -not -path '*.xctest/*' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "::error::OpenVision.app was not found under $products"
            exit 1
          fi
          echo "Packaging $app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun lipo "$app/$executable" -verify_arch arm64
          mkdir -p .build/ipa/Payload
          ditto "$app" .build/ipa/Payload/OpenVision.app
          licenses=.build/ipa/Payload/OpenVision.app/OpenSourceLicenses
          mkdir -p "$licenses"
          for component in MLXUtilsLibrary MisakiSwift kokoro-ios; do
            cp "Vendor/$component/LICENSE" "$licenses/$component.txt"
          done
          cp LICENSE "$licenses/OpenVision.txt"
          ditto -c -k --keepParent "$PWD/.build/ipa/Payload" "$PWD/.build/ipa/OpenVision-unsigned.ipa"
          unzip -tq .build/ipa/OpenVision-unsigned.ipa
      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-iOS-arm64-unsigned
          path: openvision/.build/ipa/OpenVision-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenVision-build-logs
          path: openvision/.build/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 3
