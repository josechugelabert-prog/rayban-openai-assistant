
name: RayBan - Comprobar SDK Meta

on:
  workflow_dispatch:

jobs:
  comprobar-entorno:
    runs-on: macos-26

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar Xcode y Swift
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Descargar SDK oficial de Meta
        run: |
          git clone --depth 1 https://github.com/facebook/meta-wearables-dat-ios.git meta-sdk
          test -d meta-sdk/samples/CameraAccess
          echo "SDK de Meta descargado correctamente"
